# CI for responsible-ai-toolkit.
# NOTE: this file intentionally lives in docs/, not .github/workflows/,
# because the GitHub App used for publishing lacks the Workflows
# permission. It activates by moving it to .github/workflows/ci.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
