[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-ai-toolkit"
version = "0.1.0"
description = "Responsible AI toolkit: fairness metrics, bias audits, explainability, model cards, tamper-evident audit logging, drift screens, and transparent mitigation aids."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
responsible-ai = "responsible_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
